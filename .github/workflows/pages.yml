name: Documentation site

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/build-site.cjs"
      - "scripts/serve-site.cjs"
      - "tests/site/**"
      - "tests/browser/dashboard-fixtures.js"
      - "playwright.site.config.js"
      - "docs/images/site-dashboard-overview.png"
      - "docs/images/site-dashboard-endpoints.png"
      - "docs/images/site-dashboard-request-log.png"
      - "src/MockAPI/wwwroot/app.css"
      - "src/MockAPI/wwwroot/dashboard-dom.js"
      - "src/MockAPI/wwwroot/brand-mark.svg"
      - "src/MockAPI/MockAPI.csproj"
      - ".nvmrc"
      - ".npmrc"
      - ".githooks/**"
      - "scripts/install-git-hooks.cjs"
      - "scripts/lib/pnpm-lock-registry.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/build-site.cjs"
      - "scripts/serve-site.cjs"
      - "tests/site/**"
      - "tests/browser/dashboard-fixtures.js"
      - "playwright.site.config.js"
      - "docs/images/site-dashboard-overview.png"
      - "docs/images/site-dashboard-endpoints.png"
      - "docs/images/site-dashboard-request-log.png"
      - "src/MockAPI/wwwroot/app.css"
      - "src/MockAPI/wwwroot/dashboard-dom.js"
      - "src/MockAPI/wwwroot/brand-mark.svg"
      - "src/MockAPI/MockAPI.csproj"
      - ".nvmrc"
      - ".npmrc"
      - ".githooks/**"
      - "scripts/install-git-hooks.cjs"
      - "scripts/lib/pnpm-lock-registry.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static content
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
