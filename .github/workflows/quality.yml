name: Quality engineering

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - name: Verify dependency release ages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run validate:dependency-age
      - run: dotnet restore MockAPI.slnx
      - name: Frontend coverage
        run: pnpm run test:frontend:coverage
      - name: Backend coverage
        shell: pwsh
        run: |
          dotnet test MockAPI.slnx --configuration Release --no-restore `
            --settings tests/coverage.runsettings `
            --collect:"XPlat Code Coverage" `
            --results-directory artifacts/coverage/backend `
            --logger "trx;LogFileName=backend-tests.trx" `
            -p:TreatWarningsAsErrors=true
          $report = Get-ChildItem artifacts/coverage/backend -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          ./scripts/Assert-Coverage.ps1 -Report $report.FullName
      - name: Validate trimmed publications
        shell: pwsh
        run: ./start.ps1 -Action publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-and-unit-results
          retention-days: 14
          path: |
            artifacts/coverage/**
            artifacts/coverage/backend/**/backend-tests.trx

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble@sha256:307ace13c8ba4349f790f4dfbc6eaa9fcafdeb29c218ff36129c7cacebb1e35f
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore MockAPI.slnx
      - run: dotnet build MockAPI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
      - run: pnpm exec playwright test --project chromium-desktop --grep @smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-smoke-failure
          retention-days: 14
          path: artifacts/playwright/**

  browser-chromium:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble@sha256:307ace13c8ba4349f790f4dfbc6eaa9fcafdeb29c218ff36129c7cacebb1e35f
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore MockAPI.slnx
      - run: dotnet build MockAPI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
      - run: pnpm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-chromium-results
          retention-days: 14
          path: artifacts/playwright/**
