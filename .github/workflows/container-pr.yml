name: Container pull request validation

on:
  pull_request:
    paths:
      - ".github/workflows/container-pr.yml"
      - ".github/workflows/quality.yml"
      - "scripts/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "global.json"
      - "MockAPI.slnx"
      - ".editorconfig"
      - ".gitattributes"
      - ".markdownlint.jsonc"
      - ".prettierignore"
      - ".prettierrc.json"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright.config.js"
      - "vitest.config.js"

permissions:
  contents: read

jobs:
  managed-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MockAPI.slnx
      - name: Restore formatting tools
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: dotnet test MockAPI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mockapi:pr-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Verify non-root read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mockapi-data
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            mockapi:pr-${{ matrix.suffix }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs mockapi; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' mockapi)" = "app"
          curl --fail --silent http://localhost:8080/ | grep -q '<title>MockAPI Console</title>'
          test -z "$(curl --silent --dump-header - --output /dev/null http://localhost:8080/health/live | grep -i '^server:' || true)"
      - name: Run built-in example showcase
        shell: bash
        run: |
          set -euo pipefail
          etag=$(curl --fail --silent http://localhost:8080/__mockapi/api/configuration | jq --raw-output .etag)
          curl --fail --silent --request POST \
            --header "If-Match: $etag" \
            http://localhost:8080/__mockapi/api/configuration/example/merge >/dev/null
          pwsh ./start.ps1 -Action container-showcase -Port 8080 -SkipContainerCheck
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mockapi:pr-${{ matrix.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.suffix }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mockapi:pr-${{ matrix.suffix }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.suffix }}
          path: sbom-${{ matrix.suffix }}.spdx.json
