name: Container pull request validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "config/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - ".dockerignore"
      - ".githooks/**"
      - ".npmrc"
      - "Dockerfile"
      - "Dockerfile.*"
      - "MockAPI.slnx"
      - ".editorconfig"
      - ".gitattributes"
      - "global.json"
      - ".markdownlint.jsonc"
      - ".prettierignore"
      - ".prettierrc.json"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright.config.js"
      - "start.ps1"
      - "start.sh"
      - "vitest.config.mjs"

permissions:
  contents: read

jobs:
  managed-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MockAPI.slnx
      - name: Restore formatting tools
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: |
          dotnet test MockAPI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
          pwsh -NoProfile ./tests/NativePublication.Tests.ps1

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Preserve OCI images in the native runner image store
        run: bash ./scripts/Enable-OciImageStore.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build native AOT ${{ matrix.platform }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=docker,oci-mediatypes=true
          push: false
          provenance: false
          tags: mockapi:pr-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Verify non-root read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mockapi-data
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__EnableOpenApi=true --env MockApi__EnableSwaggerUi=true \
            mockapi:pr-${{ matrix.suffix }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs mockapi; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' mockapi)" = "app"
          curl --fail --silent http://localhost:8080/ | grep -q '<title>MockAPI Console</title>'
          test -z "$(curl --silent --dump-header - --output /dev/null http://localhost:8080/health/live | grep -i '^server:' || true)"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/protected-default)" = "401"
      - name: Verify AOT payload and application behavior
        shell: bash
        run: |
          set -euo pipefail
          docker cp mockapi:/app ./published
          pwsh -NoProfile ./scripts/Assert-PublishContents.ps1 -PublishDirectory ./published -NativeAot
          # The default above is fail-closed; opt this isolated response-behavior fixture out explicitly.
          docker stop --time 10 mockapi
          docker rm mockapi
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__RequireApiKey=false \
            mockapi:pr-${{ matrix.suffix }}
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:8080/health/ready
          pwsh -NoProfile ./scripts/Test-PublishedApplication.ps1
          docker stop --time 10 mockapi
          test "$(docker inspect --format '{{.State.ExitCode}}' mockapi)" = "0"
          docker rm mockapi
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__RequireApiKey=false \
            mockapi:pr-${{ matrix.suffix }}
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:8080/health/ready
          pwsh -NoProfile ./scripts/Test-PublishedApplication.ps1 -VerifyPersistence
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mockapi:pr-${{ matrix.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.suffix }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mockapi:pr-${{ matrix.suffix }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.suffix }}
          retention-days: 14
          path: sbom-${{ matrix.suffix }}.spdx.json
