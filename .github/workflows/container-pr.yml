name: Container pull request validation

on:
  pull_request:
    paths:
      - ".github/workflows/container-pr.yml"
      - ".github/workflows/quality.yml"
      - "scripts/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "global.json"
      - "MockAPI.slnx"
      - ".editorconfig"
      - ".gitattributes"
      - ".markdownlint.jsonc"
      - ".prettierignore"
      - ".prettierrc.json"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright.config.js"
      - "vitest.config.js"

permissions:
  contents: read

jobs:
  managed-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MockAPI.slnx
      - name: Restore formatting tools
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: dotnet test MockAPI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mockapi:pr-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Verify non-root read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mockapi-data
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            mockapi:pr-${{ matrix.suffix }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs mockapi; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' mockapi)" = "app"
          curl --fail --silent http://localhost:8080/ | grep -q '<title>MockAPI Console</title>'
          test -z "$(curl --silent --dump-header - --output /dev/null http://localhost:8080/health/live | grep -i '^server:' || true)"
      - name: Run built-in example showcase
        shell: bash
        run: |
          set -euo pipefail
          etag=$(curl --fail --silent http://localhost:8080/__mockapi/api/configuration | jq --raw-output .etag)
          curl --fail --silent --request POST \
            --header "If-Match: $etag" \
            http://localhost:8080/__mockapi/api/configuration/example/merge >/dev/null
          pwsh ./start.ps1 -Action container-showcase -Port 8080 -SkipContainerCheck
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mockapi:pr-${{ matrix.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.suffix }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: mockapi:pr-${{ matrix.suffix }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.suffix }}
          path: sbom-${{ matrix.suffix }}.spdx.json
