name: Container release evidence

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mockapi:release-${{ matrix.suffix }}
      - name: Verify native image
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mockapi-data
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            mockapi:release-${{ matrix.suffix }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs mockapi; exit 1; fi
            sleep 1
          done
          docker inspect mockapi > container-${{ matrix.suffix }}.json
          docker image inspect mockapi:release-${{ matrix.suffix }} > image-${{ matrix.suffix }}.json
          docker stats --no-stream mockapi > stats-${{ matrix.suffix }}.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mockapi:release-${{ matrix.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.suffix }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mockapi:release-${{ matrix.suffix }}
          format: json
          output: trivy-${{ matrix.suffix }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.suffix }}-evidence
          path: |
            container-${{ matrix.suffix }}.json
            image-${{ matrix.suffix }}.json
            stats-${{ matrix.suffix }}.txt
            sbom-${{ matrix.suffix }}.spdx.json
            trivy-${{ matrix.suffix }}.json

  oci-index:
    needs: native-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multi-platform OCI index
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/mockapi-oci.tar
      - name: Verify OCI index architectures
        shell: bash
        run: |
          set -euo pipefail
          index=$(tar --extract --to-stdout --file /tmp/mockapi-oci.tar index.json)
          test "$(jq '.manifests | length' <<< "$index")" -ge 1
          tar --extract --directory /tmp --file /tmp/mockapi-oci.tar
          manifest_digest=$(jq --raw-output '.manifests[0].digest' <<< "$index" | cut -d: -f2)
          manifest=$(cat "/tmp/blobs/sha256/${manifest_digest}")
          platforms=$(jq --compact-output '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort' <<< "$manifest")
          test "$platforms" = '["linux/amd64","linux/arm64"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mockapi-multi-platform-oci
          path: /tmp/mockapi-oci.tar

  publishing-disabled:
    needs: [native-image, oci-index]
    runs-on: ubuntu-latest
    steps:
      - name: Record publishing boundary
        run: echo "Docker Hub publishing remains disabled until namespace, credentials, and tag policy are approved."
