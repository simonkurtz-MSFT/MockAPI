name: Publish release container

on:
  workflow_call:
    inputs:
      tagname:
        description: Existing validated Git tag in exact <Version> form
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tagname:
        description: Existing validated Git tag in exact <Version> form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-release-${{ inputs.tagname }}
  cancel-in-progress: false

env:
  IMAGE_NAME: simonkurtzmsft/mockapi
  RUNNER_X64: &runner-x64 ubuntu-26.04
  RUNNER_ARM64: &runner-arm64 ubuntu-26.04-arm

jobs:
  preflight:
    runs-on: *runner-x64
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run container publication from main with an existing validated tag."
            exit 1
          fi
          for tool in docker gh; do command -v "$tool"; done
          docker info >/dev/null
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Resolve and validate the immutable release commit
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tagname }}
        run: node scripts/release-version.cjs resolve "$REQUESTED_TAG"
      - name: Require successful quality evidence for this exact commit
        # Reusable workflows inherit the caller's event, including manual quality runs.
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'Publish release container'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/release-quality.cjs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the existing changelog release before native builds
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release-notes.cjs verify "$IMAGE_TAG"
      - name: Verify Docker Hub credentials before native builds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          if docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null 2> tag-check.txt; then
            echo "::error::Refusing to replace existing release tag $IMAGE_NAME:$IMAGE_TAG."
            exit 1
          elif ! grep -Eqi 'manifest unknown|not found|no such manifest' tag-check.txt; then
            cat tag-check.txt >&2
            exit 1
          fi
          docker logout

  native-image:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: *runner-x64
            platform: linux/amd64
            suffix: amd64
          - runner: *runner-arm64
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Verify native runner prerequisites
        run: |
          set -euo pipefail
          for tool in docker pwsh curl jq; do command -v "$tool"; done
          pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required." }'
      - name: Preserve OCI images in the native runner image store
        run: bash ./scripts/Enable-OciImageStore.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build native AOT image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=docker,oci-mediatypes=true
          push: false
          provenance: false
          tags: mockapi:release-${{ matrix.suffix }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}
      - name: Verify native image
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mockapi-data
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__EnableOpenApi=true --env MockApi__EnableSwaggerUi=true \
            mockapi:release-${{ matrix.suffix }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs mockapi; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' mockapi)" = "app"
          docker stats --no-stream mockapi > idle-stats-${{ matrix.suffix }}.txt
          docker cp mockapi:/app ./published
          pwsh -NoProfile ./scripts/Assert-PublishContents.ps1 -PublishDirectory ./published -NativeAot
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/protected-default)" = "401"
          # The default above is fail-closed; opt this isolated response-behavior fixture out explicitly.
          docker stop --time 10 mockapi
          docker rm mockapi
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__RequireApiKey=false \
            --env MockApi__EnableOpenApi=true --env MockApi__EnableSwaggerUi=true \
            mockapi:release-${{ matrix.suffix }}
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent http://localhost:8080/health/ready
          pwsh -NoProfile ./scripts/Test-PublishedApplication.ps1
          docker stats --no-stream mockapi > loaded-stats-${{ matrix.suffix }}.txt
          docker stop --time 10 mockapi
          test "$(docker inspect --format '{{.State.ExitCode}}' mockapi)" = "0"
          docker rm mockapi
          docker run --detach --name mockapi \
            --read-only --cpus 0.5 --memory 256m \
            --publish 8080:8080 --volume mockapi-data:/data \
            --env MockApi__RequireApiKey=false \
            --env MockApi__EnableOpenApi=true --env MockApi__EnableSwaggerUi=true \
            mockapi:release-${{ matrix.suffix }}
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent http://localhost:8080/health/ready
          pwsh -NoProfile ./scripts/Test-PublishedApplication.ps1 -VerifyPersistence
          docker inspect mockapi > container-${{ matrix.suffix }}.json
          docker image inspect mockapi:release-${{ matrix.suffix }} > image-${{ matrix.suffix }}.json
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mockapi:release-${{ matrix.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.suffix }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mockapi:release-${{ matrix.suffix }}
          format: json
          output: trivy-${{ matrix.suffix }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Export the tested image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format '{{.Id}}' mockapi:release-${{ matrix.suffix }} > image-${{ matrix.suffix }}.id
          docker save --output image-${{ matrix.suffix }}.tar mockapi:release-${{ matrix.suffix }}
      - name: Capture native container diagnostics on failure
        if: failure()
        run: |
          if docker container inspect mockapi > container-${{ matrix.suffix }}.json; then
            docker logs mockapi > container-${{ matrix.suffix }}.log 2>&1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-${{ matrix.suffix }}-evidence
          retention-days: 14
          path: |
            container-${{ matrix.suffix }}.json
            container-${{ matrix.suffix }}.log
            image-${{ matrix.suffix }}.json
            idle-stats-${{ matrix.suffix }}.txt
            loaded-stats-${{ matrix.suffix }}.txt
            sbom-${{ matrix.suffix }}.spdx.json
            trivy-${{ matrix.suffix }}.json
            image-${{ matrix.suffix }}.id
            image-${{ matrix.suffix }}.tar

  publish:
    needs: [preflight, native-image]
    runs-on: *runner-x64
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IMAGE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Preserve the tested OCI images during load and push
        run: bash ./scripts/Enable-OciImageStore.sh
      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/MockAPI/MockAPI.csproj)
          test -n "$version"
          test "$IMAGE_TAG" = "$version"
          test "$(git rev-parse "refs/tags/$IMAGE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*-evidence
          path: native-images
          merge-multiple: true
      - name: Verify the existing changelog release before publishing images
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes.cjs verify "$IMAGE_TAG"
      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish tested native images and assemble the index
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null 2> tag-check.txt; then
            echo "Refusing to replace existing release tag $IMAGE_NAME:$IMAGE_TAG" >&2
            exit 1
          elif ! grep -Eqi 'manifest unknown|not found|no such manifest' tag-check.txt; then
            cat tag-check.txt >&2
            exit 1
          fi
          references=()
          for arch in amd64 arm64; do
            docker load --input "native-images/image-$arch.tar"
            expected_id=$(cat "native-images/image-$arch.id")
            expected_config_digest=$(
              tar --extract --to-stdout \
                --file "native-images/image-$arch.tar" \
                "blobs/sha256/${expected_id#sha256:}" |
                jq --exit-status --raw-output '.config.digest'
            )
            test "$(docker image inspect --format '{{.Id}}' "mockapi:release-$arch")" = "$expected_id"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$expected_id")" = "linux/$arch"
            candidate="$IMAGE_NAME:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "$expected_id" "$candidate"
            push_log="push-$arch.log"
            docker push "$candidate" 2>&1 | tee "$push_log"
            digest=$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64})( size:.*)?$/\1/p' "$push_log" | tail -n 1)
            if [ -z "$digest" ]; then
              echo "Docker did not report a digest after pushing $candidate." >&2
              exit 1
            fi
            if [ "$digest" != "$expected_id" ]; then
              echo "Pushed manifest digest $digest does not match tested image digest $expected_id." >&2
              exit 1
            fi
            reference="$IMAGE_NAME@$digest"
            docker buildx imagetools inspect --raw "$reference" > "manifest-$arch.json"
            test "$(jq --raw-output '.mediaType' "manifest-$arch.json")" = 'application/vnd.oci.image.manifest.v1+json'
            test "$(jq --raw-output '.config.digest' "manifest-$arch.json")" = "$expected_config_digest"
            jq '{compressedLayerBytes: ([.layers[].size] | add)}' "manifest-$arch.json" > "size-$arch.json"
            references+=("$reference")
          done
          docker buildx imagetools create --dry-run "${references[@]}" > index.json
          test "$(jq --raw-output '.mediaType' index.json)" = 'application/vnd.oci.image.index.v1+json'
          test "$(jq --compact-output '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort' index.json)" = '["linux/amd64","linux/arm64"]'
          expected_digests=$(printf '%s\n' "${references[@]#*@}" | jq --raw-input --slurp 'split("\n") | map(select(length > 0)) | sort')
          test "$(jq '[.manifests[].digest] | sort' index.json)" = "$expected_digests"
          docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_TAG" "${references[@]}"
          docker buildx imagetools inspect --raw "$IMAGE_NAME:$IMAGE_TAG" > published-index.json
          diff <(jq --sort-keys . index.json) <(jq --sort-keys . published-index.json)
      - name: Remove temporary candidate tags
        if: always()
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          authentication=$(
            jq --null-input --compact-output \
              --arg identifier "$DOCKERHUB_USERNAME" \
              --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}'
          )
          access_token=$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$authentication" \
              https://hub.docker.com/v2/auth/token |
              jq --exit-status --raw-output '.access_token'
          )
          for arch in amd64 arm64; do
            candidate="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            response_file="delete-$arch.json"
            status=$(
              curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request DELETE \
                --header "Authorization: Bearer $access_token" \
                "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$candidate/"
            )
            if [ "$status" = 204 ]; then
              echo "Removed temporary Docker Hub tag $IMAGE_NAME:$candidate."
            elif [ "$status" = 404 ]; then
              echo "Temporary Docker Hub tag $IMAGE_NAME:$candidate was not present."
            else
              cat "$response_file" >&2
              echo "Docker Hub returned HTTP $status while removing $IMAGE_NAME:$candidate." >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mockapi-multi-platform-index
          retention-days: 14
          path: |
            index.json
            published-index.json
            manifest-*.json
            size-*.json
      - name: Attach durable evidence without replacing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" \
            published-index.json manifest-*.json size-*.json \
            native-images/sbom-*.spdx.json native-images/trivy-*.json \
            native-images/idle-stats-*.txt native-images/loaded-stats-*.txt \
            native-images/image-*.json native-images/container-*.json
